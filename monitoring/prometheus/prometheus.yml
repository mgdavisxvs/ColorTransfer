# ============================================================================
# Prometheus Configuration for Color Transfer Framework
# Scrapes metrics from all services
# ============================================================================

global:
  scrape_interval: 15s       # How often to scrape targets
  scrape_timeout: 10s        # Timeout for scraping
  evaluation_interval: 15s   # How often to evaluate rules

  # External labels to attach to all metrics
  external_labels:
    cluster: 'color-transfer'
    environment: 'production'

# Alertmanager configuration (optional)
# Uncomment to enable AlertManager integration
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load alerting rules
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # ========================================================================
  # Prometheus Self-Monitoring
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ========================================================================
  # Color Transfer API Service
  # ========================================================================
  - job_name: 'color-transfer-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'color-transfer-api'
          interface: 'api'
    # Relabel to add custom labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # ========================================================================
  # Color Transfer Web UI Service
  # ========================================================================
  - job_name: 'color-transfer-web'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['web:5000']
        labels:
          service: 'color-transfer-web'
          interface: 'web'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # ========================================================================
  # Color Transfer Enhanced Web UI Service
  # ========================================================================
  - job_name: 'color-transfer-web-enhanced'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['web_enhanced:5000']
        labels:
          service: 'color-transfer-web-enhanced'
          interface: 'web_enhanced'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # ========================================================================
  # Redis Exporter (requires redis_exporter sidecar)
  # ========================================================================
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'

  # ========================================================================
  # Node Exporter (for system metrics)
  # ========================================================================
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'

  # ========================================================================
  # cAdvisor (for container metrics)
  # ========================================================================
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'cadvisor'

# ============================================================================
# Knuth's Monitoring Philosophy
# ============================================================================
#
# "You can't improve what you don't measure" - Applied to observability
#
# This configuration provides:
# 1. Comprehensive service coverage (API, Web, Enhanced Web)
# 2. Appropriate scrape intervals (10-15s balance)
# 3. Custom labels for service identification
# 4. Optional exporters for infrastructure metrics
# 5. External labels for multi-cluster support
#
# Graham's Practical Monitoring:
# 1. Start with application metrics (most valuable)
# 2. Add infrastructure metrics as needed
# 3. Keep scrape intervals reasonable (10-15s)
# 4. Use labels for filtering and aggregation
# 5. Enable alerting when patterns are clear
#
# ============================================================================
