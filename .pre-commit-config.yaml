# ============================================================================
# Pre-commit Configuration for Color Transfer Framework
# Automates code quality checks on git commit
# ============================================================================
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   Hooks run automatically on git commit
#   Manual run: pre-commit run --all-files
#   Update hooks: pre-commit autoupdate
#
# ============================================================================

default_language_version:
  python: python3.11

repos:
  # ==========================================================================
  # General File Checks
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # File validation
      - id: check-yaml
        args: [--safe]
      - id: check-toml
      - id: check-json
      - id: check-xml

      # Code validation
      - id: check-ast                    # Valid Python syntax
      - id: check-docstring-first        # Docstring before code
      - id: check-merge-conflict         # No merge conflict markers
      - id: check-added-large-files      # No large files
        args: [--maxkb=1000]
      - id: check-case-conflict          # Filename case conflicts
      - id: detect-private-key           # No private keys

      # Formatting
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]
        exclude: 'monitoring/grafana/dashboards/.*\.json$'  # Keep Grafana dashboards as-is

  # ==========================================================================
  # Python Code Formatting
  # ==========================================================================
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3.11
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        args: [--profile=black, --line-length=100]

  # ==========================================================================
  # Python Linting
  # ==========================================================================
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint with Flake8
        args:
          - --max-line-length=100
          - --extend-ignore=E203,W503,E501
          - --max-complexity=15
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions

  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        name: Lint with Pylint
        args:
          - --max-line-length=100
          - --disable=C0114,C0115,C0116,R0903,R0913,W0212
        exclude: 'tests/.*'

  # ==========================================================================
  # Type Checking
  # ==========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        name: Type check with MyPy
        args: [--ignore-missing-imports, --python-version=3.11]
        additional_dependencies:
          - types-PyYAML
          - types-requests
        exclude: 'tests/.*'

  # ==========================================================================
  # Security Checks
  # ==========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security check with Bandit
        args:
          - -r
          - --severity-level=medium
          - --confidence-level=medium
          - --skip=B101,B601  # Skip assert_used and shell=True
        exclude: 'tests/.*'

  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        name: Check dependencies for vulnerabilities
        files: requirements.*\.txt$

  # ==========================================================================
  # Documentation
  # ==========================================================================
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: Check docstring style
        args:
          - --convention=google
          - --add-ignore=D100,D104,D107
        exclude: 'tests/.*'

  # ==========================================================================
  # YAML/JSON/TOML Formatting
  # ==========================================================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Format YAML/JSON/Markdown with Prettier
        types_or: [yaml, json, markdown]
        exclude: 'monitoring/grafana/dashboards/.*\.json$'

  # ==========================================================================
  # Docker
  # ==========================================================================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfile with Hadolint
        args: [--ignore, DL3008, --ignore, DL3013]

  # ==========================================================================
  # Shell Scripts
  # ==========================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Lint shell scripts with ShellCheck
        args: [--severity=warning]

  # ==========================================================================
  # Git Commit Message
  # ==========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: Check commit message format
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert]

# ============================================================================
# Configuration Options
# ============================================================================

# Fail fast - stop on first failure
fail_fast: false

# Files to exclude from all hooks
exclude: |
  (?x)^(
    .*_test\.py|
    .*\.pyc|
    .*/__pycache__/.*|
    \.git/.*|
    \.pytest_cache/.*|
    \.mypy_cache/.*|
    \.venv/.*|
    venv/.*|
    build/.*|
    dist/.*|
    .*\.egg-info/.*|
    Capture\.PNG
  )$

# ============================================================================
# Usage Examples
# ============================================================================
#
# Install pre-commit:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# Run on specific files:
#   pre-commit run --files color_transfer_framework/transfer_engine.py
#
# Run specific hook:
#   pre-commit run black --all-files
#   pre-commit run flake8 --all-files
#
# Update hooks to latest versions:
#   pre-commit autoupdate
#
# Skip hooks for a commit (not recommended):
#   git commit --no-verify -m "message"
#
# Install commit-msg hook (for conventional commits):
#   pre-commit install --hook-type commit-msg
#
# ============================================================================
# Knuth's Code Quality Philosophy
# ============================================================================
#
# "Programs are meant to be read by humans and only incidentally for
#  computers to execute."
#
# These hooks ensure:
# 1. Code is properly formatted (Black, isort)
# 2. Code follows standards (Flake8, Pylint)
# 3. Code is type-safe (MyPy)
# 4. Code is secure (Bandit, Safety)
# 5. Documentation is complete (Pydocstyle)
#
# Graham's Practical Automation:
# 1. Fast feedback (catches issues early)
# 2. Consistent style (no style debates)
# 3. Automated fixes (Black, isort auto-format)
# 4. Security checks (catch vulnerabilities)
# 5. Low friction (runs automatically)
#
# ============================================================================
