# ============================================================================
# Color Transfer Framework v2.0 - Python Package Configuration
# PEP 518/621 compliant package metadata
# ============================================================================

[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "color-transfer-framework"
version = "2.0.0"
description = "Production-ready color transfer framework with multiple algorithms and interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Color Transfer Framework Team"}
]
maintainers = [
    {name = "Color Transfer Framework Team"}
]
keywords = [
    "color-transfer",
    "image-processing",
    "computer-vision",
    "opencv",
    "color-space",
    "reinhard",
    "histogram-matching",
    "image-analysis",
    "api",
    "flask",
    "fastapi"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ============================================================================
# Dependencies
# ============================================================================

dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "psutil>=5.8.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "flask>=2.3.0",
    "flask-sock>=0.6.0",
    "textual>=0.48.0",
    "pyyaml>=6.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "scikit-learn>=0.24.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

# ============================================================================
# Optional Dependencies
# ============================================================================

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "mypy>=1.7.0",
    "pylint>=3.0.0",
    "flake8>=6.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "bandit>=1.7.5",
]

# Testing dependencies
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "pytest-playwright>=0.4.3",
    "playwright>=1.40.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "locust>=2.18.0",
    "scikit-image>=0.22.0",
    "Pillow>=10.1.0",
    "imagehash>=4.3.1",
    "jsonschema>=4.20.0",
    "mutmut>=2.4.4",
]

# Documentation dependencies
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "docutils>=0.20.0",
    "myst-parser>=2.0.0",
]

# GPU acceleration
gpu = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
]

# All optional dependencies
all = [
    "color-transfer-framework[dev,test,docs,gpu]",
]

# ============================================================================
# URLs
# ============================================================================

[project.urls]
Homepage = "https://github.com/mgdavisxvs/ColorTransfer"
Documentation = "https://github.com/mgdavisxvs/ColorTransfer/blob/main/README.md"
Repository = "https://github.com/mgdavisxvs/ColorTransfer"
Issues = "https://github.com/mgdavisxvs/ColorTransfer/issues"
Changelog = "https://github.com/mgdavisxvs/ColorTransfer/blob/main/CHANGELOG.md"

# ============================================================================
# Entry Points
# ============================================================================

[project.scripts]
# CLI entry points
color-transfer = "color_transfer_framework.interface_layer.cli:app"
color-transfer-api = "color_transfer_framework.interface_layer.api:main"
color-transfer-web = "color_transfer_framework.interface_layer.web:main"
color-transfer-tui = "color_transfer_framework.interface_layer.tui:main"

# ============================================================================
# Tool Configuration
# ============================================================================

# Black - Code Formatting
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort - Import Sorting
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

# pytest - Testing
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=color_transfer_framework",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage
[tool.coverage.run]
source = ["color_transfer_framework"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# MyPy - Static Type Checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true

# Pylint - Code Linting
[tool.pylint.main]
py-version = "3.9"
jobs = 0  # Auto-detect CPU cores
load-plugins = []

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name (too restrictive)
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0212",  # Access to protected member
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-locals = 20
max-branches = 15
max-statements = 60

# Bandit - Security Linting
[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101", "B601"]  # Skip assert_used, shell=True warnings

# ============================================================================
# Setuptools Configuration
# ============================================================================

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["color_transfer_framework*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
color_transfer_framework = [
    "py.typed",
    "*.yaml",
    "*.yml",
    "*.json",
]

# ============================================================================
# Build and Distribution
# ============================================================================

[tool.setuptools.dynamic]
# version = {attr = "color_transfer_framework.__version__"}

# ============================================================================
# Installation Guide
# ============================================================================
#
# Install from source:
#   pip install .
#
# Install with development dependencies:
#   pip install -e ".[dev]"
#
# Install with all optional dependencies:
#   pip install ".[all]"
#
# Install for testing:
#   pip install ".[test]"
#
# Build distribution:
#   python -m build
#
# Upload to PyPI:
#   python -m twine upload dist/*
#
# ============================================================================
# Knuth's Package Design Philosophy
# ============================================================================
#
# "Programs are meant to be read by humans and only incidentally for computers
#  to execute." - Donald Knuth
#
# This package configuration follows:
# 1. PEP 518/621 standards for modern Python packaging
# 2. Clear separation of core vs optional dependencies
# 3. Comprehensive tool configuration in one place
# 4. Entry points for all interfaces
# 5. Proper metadata for PyPI distribution
#
# Graham's Practical Packaging:
# 1. Easy installation: pip install color-transfer-framework
# 2. Clear optional dependencies: [dev], [test], [gpu], [all]
# 3. Entry points for all interfaces
# 4. Proper versioning and metadata
# 5. Tool configurations centralized
#
# ============================================================================
